name: Tests

on:
  push:
  pull_request:

jobs:
  smoke:
    name: Tests de fumée de l'API
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, mbstring

      # Aucun fichier .env en CI : les accès sont fournis par l'environnement,
      # qui est prioritaire (voir backend/config.php).
      - name: Exécuter la suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USER: root
          DB_PASS: root
          DB_NAME: cigareglobe
          TEST_DB: cigareglobe_test
        run: php tests/run.php
