# ════════════════════════════════════════════════════════
# dev/httpd-cigarodyssey.conf — serveur de développement
# ────────────────────────────────────────────────────────
# POURQUOI APACHE ET NON « php -S »
#
# Le serveur intégré de PHP est MONO-PROCESSUS SOUS WINDOWS :
# PHP_CLI_SERVER_WORKERS repose sur fork(), qui n'existe pas ici. Une
# seule connexion suffit alors à le geler.
#
# Et c'est exactement ce qui arrive avec un navigateur : Chrome ouvre des
# connexions de préchargement qu'il garde ouvertes sans envoyer de
# requête. Le journal du serveur montre alors « Accepted » sans jamais de
# ligne de réponse, et plus rien n'est servi — ni l'API, ni même un
# fichier statique. Diagnostic vérifié : après une telle connexion,
# `/index.html` lui-même ne répond plus au bout de soixante secondes.
#
# Apache est multi-processus, applique le .htaccess du dépôt (donc les
# interdictions ET les URL par langue, sans avoir besoin de
# tools/dev-router.php), et c'est le serveur de production. Le
# développement ressemble ainsi à la production.
#
# ── LANCEMENT ───────────────────────────────────────────
#
#   "C:/wamp64/bin/apache/apache2.4.62.1/bin/httpd.exe" -f "C:/CLAUDE/cigareglobe/dev/httpd-cigarodyssey.conf"
#
# Puis http://127.0.0.1:8098/. Pour arrêter : Ctrl+C dans la console, ou
# Stop-Process sur le httpd dont la ligne de commande cite CE fichier.
#
# ── POURQUOI CE FICHIER EST VERSIONNÉ ───────────────────
#
# La version précédente vivait dans un répertoire temporaire. Le fichier
# a été supprimé, le processus a continué de tourner des jours durant, et
# plus personne ne pouvait savoir ce qu'il servait — il a fallu
# l'interroger par sa ligne de commande pour l'identifier. Une
# configuration de serveur appartient au dépôt.
#
# ── ÉCOUTE LOCALE UNIQUEMENT ────────────────────────────
#
# 127.0.0.1, jamais 0.0.0.0. Ouvrir au réseau local expose .env — qui
# porte les accès MySQL et la clé d'administration — à quiconque est sur
# le même Wi-Fi. Si un essai sur mobile devient nécessaire, ce sera une
# décision explicite, pas un défaut de configuration.
# ════════════════════════════════════════════════════════

ServerRoot "C:/wamp64/bin/apache/apache2.4.62.1"
Listen 127.0.0.1:8098
ServerName cigarodyssey.local

LoadModule authz_core_module   modules/mod_authz_core.so
# `Require local` est fourni par authz_host, pas par authz_core. Sans
# lui : « Unknown Authz provider: local ».
LoadModule authz_host_module   modules/mod_authz_host.so
LoadModule dir_module          modules/mod_dir.so
LoadModule mime_module         modules/mod_mime.so
LoadModule rewrite_module      modules/mod_rewrite.so
LoadModule headers_module      modules/mod_headers.so
LoadModule expires_module      modules/mod_expires.so
LoadModule log_config_module   modules/mod_log_config.so
LoadModule setenvif_module     modules/mod_setenvif.so
# Pas de LoadModule pour le MPM : sous Windows, mpm_winnt est compilé
# dans httpd.exe et n'existe pas en fichier séparé. La ligne le déclarant
# fait échouer le démarrage — « module introuvable ».

# ── PHP EN MODULE : SUIVRE L'ARRANGEMENT DE WAMP ────────
#
# Deux pièges, découverts en voyant `data.php` répondre 500 avec
# « Undefined constant PDO::MYSQL_ATTR_INIT_COMMAND » — autrement dit
# pdo_mysql absent, alors qu'il est bien chargé en ligne de commande.
#
#   1. WAMP fait tourner Apache avec PHP 8.3.14, pas 8.4.0. La ligne de
#      commande, elle, utilise 8.4.0. Charger le module de 8.4 tout en
#      laissant le php.ini de WAMP pointer ailleurs donne un PHP sans
#      extensions.
#
#   2. `PHPIniDir` de WAMP vise le répertoire BIN D'APACHE, pas celui de
#      PHP. On y trouve un php.ini qui est un lien vers
#      php8.3.14/phpForApache.ini, avec son propre extension_dir. Viser
#      le répertoire de PHP charge un autre fichier, et les extensions
#      ne suivent pas.
#
# On reprend donc exactement ce que fait conf/httpd.conf de WAMP.
LoadModule php_module "C:/wamp64/bin/php/php8.3.14/php8apache2_4.dll"
<IfModule php_module>
    PHPIniDir "C:/wamp64/bin/apache/apache2.4.62.1/bin"
    AddHandler application/x-httpd-php .php
</IfModule>

TypesConfig conf/mime.types
DirectoryIndex index.php index.html

DocumentRoot "C:/CLAUDE/cigareglobe"
<Directory "C:/CLAUDE/cigareglobe">
    # AllowOverride All : le .htaccess du dépôt fait foi, comme en
    # production. C'est lui qui interdit .env et réécrit /en/, /es/…
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require local
</Directory>

ErrorLog  "C:/CLAUDE/cigareglobe/dev/httpd-error.log"
CustomLog "C:/CLAUDE/cigareglobe/dev/httpd-access.log" common
PidFile   "C:/CLAUDE/cigareglobe/dev/httpd.pid"
